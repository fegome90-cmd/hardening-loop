[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardening-loop"
version = "0.1.0"
description = "Algorithmic Code Hardening Loop v0.3 - Operational Framework & Minimal Runner"
authors = [{ name = "Felipe Gonzalez" }]
readme = "docs/spec_v0.1.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hardening-loop = "hardening_loop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
