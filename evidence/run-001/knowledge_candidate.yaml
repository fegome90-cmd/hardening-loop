- candidate_id: kc-01ab93723a70
  observation: Target read tool accesses filesystem paths directly without verifying
    workspace root containment.
  finding:
    category: SECURITY
    severity: HIGH
    description: Arbitrary path reading allows directory traversal outside workspace.
    target_lines:
    - 68
    - 69
    - 71
  rule_proposal:
    rule_id: RULE-SEC-002
    title: Workspace Path Sandboxing for Read Tools
    enforcement_mechanism: SCHEMA_GUARD
    rationale: Prevent leakage of credentials and sensitive dotfiles outside project
      scope.
    suggested_fix: Resolve paths with os.path.realpath and assert startswith(workspace_root).
