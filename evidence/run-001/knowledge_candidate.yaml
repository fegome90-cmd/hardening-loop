- candidate_id: kc-bd0b7d675cba
  observation: Target tool wrapper invokes bash via generic shell without enforcing
    an explicit executable whitelist.
  finding:
    category: SECURITY
    severity: HIGH
    description: Generic subprocess execution without token/command whitelist exposes
      runner to arbitrary command injection.
    target_lines:
    - 53
    - 54
    - 58
    - 59
  rule_proposal:
    rule_id: RULE-SEC-001
    title: Mandatory Executable Whitelist for Tool Call Runners
    enforcement_mechanism: CONTRACT_VALIDATOR
    rationale: LLM tool agents must not be granted open shell access; commands must
      be validated against an approved executable set.
    suggested_fix: Introduce an explicit set of allowed binaries (e.g. {'git', 'pytest',
      'make'}) before subprocess invocation.
  evidence_references: &id001
  - evi-f419be2d36a1
  - evi-ac3c99f15c78
  - evi-fbeaef974e9b
  - evi-b3e5f70966b6
